name: CI

on:
  push:
    branches:
      - "**"          # every branch, every push
  pull_request:
    branches:
      - main          # every PR targeting main must pass

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:

  # ── 1. Type-check ────────────────────────────────────────────────────────────
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  # ── 2. Lints ─────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  # ── 3. Unit tests ────────────────────────────────────────────────────────────
  test:
    name: cargo test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --no-fail-fast

  # ── 4. End-to-end: compile + run examples/main.brn and examples/game/main.brn
  # Runs on both Linux and Windows.
  # Each compile and run step captures output and prints it inline on failure
  # using ::error:: annotations so GitHub highlights the exact failing step
  # in the Actions UI — no artifact download needed to see what went wrong.
  e2e:
    name: e2e / ${{ matrix.os }}
    needs: [clippy, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang llvm

      - name: Install clang (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --yes --no-progress
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # ── Build Brain compiler ────────────────────────────────────────────────
      - name: Build brain compiler
        run: cargo build --release

      # ── examples/main.brn ──────────────────────────────────────────────────
      - name: "[examples/main] Compile"
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="./target/release/brain.exe"
          else
            BIN="./target/release/brain"
          fi

          output=$($BIN examples/main.brn examples/main 2>&1)
          exit_code=$?
          echo "$output"

          if [ $exit_code -ne 0 ]; then
            echo "::error file=examples/main.brn::Compiler failed — see output below"
            echo "::group::Full compiler output"
            echo "$output"
            echo "::endgroup::"
            exit 1
          fi

      - name: "[examples/main] Run"
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            output=$(./examples/main.exe 2>&1)
          else
            output=$(./examples/main 2>&1)
          fi
          exit_code=$?
          echo "$output"

          if [ $exit_code -ne 0 ]; then
            echo "::error file=examples/main.brn::Program crashed at runtime (exit $exit_code)"
            echo "::group::Program output"
            echo "$output"
            echo "::endgroup::"
            exit 1
          fi

      # ── examples/game/main.brn ─────────────────────────────────────────────
      - name: "[examples/game] Compile"
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            BIN="./target/release/brain.exe"
          else
            BIN="./target/release/brain"
          fi

          output=$($BIN examples/game/main.brn examples/game/main 2>&1)
          exit_code=$?
          echo "$output"

          if [ $exit_code -ne 0 ]; then
            echo "::error file=examples/game/main.brn::Compiler failed — see output below"
            echo "::group::Full compiler output"
            echo "$output"
            echo "::endgroup::"
            exit 1
          fi

      - name: "[examples/game] Run"
        shell: bash
        run: |
          set +e
          if [ "$RUNNER_OS" = "Windows" ]; then
            output=$(./examples/game/main.exe 2>&1)
          else
            output=$(./examples/game/main 2>&1)
          fi
          exit_code=$?
          echo "$output"

          if [ $exit_code -ne 0 ]; then
            echo "::error file=examples/game/main.brn::Program crashed at runtime (exit $exit_code)"
            echo "::group::Program output"
            echo "$output"
            echo "::endgroup::"
            exit 1
          fi

      # ── Upload .ll files on any failure so you can inspect the IR ──────────
      - name: Upload LLVM IR on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: llvm-ir-${{ matrix.os }}
          path: |
            examples/main.ll
            examples/game/main.ll
          retention-days: 7
