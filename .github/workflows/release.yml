name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0-beta.1)"
        required: true
        default: "v0.1.0-beta.1"

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LLVM_VERSION: "18"
  LLVM_FULL_VERSION: "18.1.8"

jobs:

  release-windows:
    name: Release / windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build brain
        run: cargo build --release

      - name: Download LLVM for Windows
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_FULL_VERSION/LLVM-$env:LLVM_FULL_VERSION-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile llvm-installer.exe
          Start-Process -FilePath ".\llvm-installer.exe" -ArgumentList "/S", "/D=$pwd\llvm-dist" -Wait

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item target/release/brain.exe dist/
          Copy-Item llvm-dist/bin/clang.exe dist/
          Copy-Item llvm-dist/bin/lld-link.exe dist/
          $lines = @(
            "Brain Compiler - Windows x64",
            "Usage: brain.exe source.brn [output]",
            "Bundled clang $env:LLVM_FULL_VERSION included - no LLVM install needed.",
            "Set BRAIN_CLANG env var to use your own clang."
          )
          $lines | Out-File -FilePath dist/README.txt -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath brain-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: brain-windows-x64
          path: brain-windows-x64.zip

  release-linux:
    name: Release / linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build brain
        run: cargo build --release

      - name: Install clang-18
        run: |
          sudo apt-get install -y clang-18

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/brain dist/
          # Copy the clang-18 binary from the runner (already installed via apt)
          cp $(which clang-18) dist/clang
          chmod +x dist/clang
          echo "Brain Compiler - Linux x64" > dist/README.txt
          echo "Usage: ./brain source.brn [output]" >> dist/README.txt
          echo "Bundled clang ${LLVM_FULL_VERSION} included - no LLVM install needed." >> dist/README.txt
          echo "Set BRAIN_CLANG env var to use your own clang." >> dist/README.txt
          tar -czf brain-linux-x64.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: brain-linux-x64
          path: brain-linux-x64.tar.gz

  publish:
    name: Publish GitHub Release
    needs: [release-windows, release-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: "Brain ${{ github.ref_name }}"
          draft: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          body: |
            ## Brain ${{ github.ref_name }}

            **Windows** — download `brain-windows-x64.zip`, unzip, run `brain.exe`
            **Linux** — download `brain-linux-x64.tar.gz`, extract, run `./brain`

            No LLVM installation required — clang ${{ env.LLVM_FULL_VERSION }} is bundled.
          files: |
            artifacts/brain-windows-x64/brain-windows-x64.zip
            artifacts/brain-linux-x64/brain-linux-x64.tar.gz
